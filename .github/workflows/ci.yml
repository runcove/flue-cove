name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:vendor
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The example installs flue-cove as a copy, built by the root's prepare
      # script, so it needs the root's dev dependencies installed first.
      # Typecheck only: no Cove server or model credentials are involved.
      - run: npm ci
        working-directory: examples/repo-agent
      - run: npm run typecheck
        working-directory: examples/repo-agent
